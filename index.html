
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>jefach1ca</title>

    <meta
        name="description"
        content="Music, video, articles and experiments by jefach1ca"
    >

    <link rel="stylesheet" href="style.css">

    <style>

        /* Articles button */

        .articles-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

            width: fit-content;
            min-width: 150px;
            margin: 0 auto 28px;
            padding: 12px 20px;

            color: #b8ddff;
            background: rgba(142, 203, 255, 0.07);
            border: 1px solid rgba(142, 203, 255, 0.35);
            border-radius: 12px;

            font-size: 14px;
            letter-spacing: 0.06em;
            text-decoration: none;

            transition: background 0.2s ease,
                        transform 0.2s ease;
        }

        .articles-button:hover {
            background: rgba(142, 203, 255, 0.16);
            transform: translateY(-2px);
        }

        .articles-icon {
            font-size: 17px;
        }

        .external-arrow {
            opacity: 0.65;
        }


        /* Featured SoundCloud track */

        .featured-track {
            margin-bottom: 32px;
        }

        .featured-track .soundcloud-player {
            display: block;
            width: 100%;
            border-radius: 12px;
        }


        /* Music video */

        .video-section {
            width: 100%;
            max-width: 460px;
            margin: 0 auto 36px;
        }

        .video-heading {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;

            color: #b8ddff;
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: lowercase;
        }

        .video-symbol {
            color: #8ecbff;
        }

        .video-thumbnail {
            position: relative;
            display: block;
            overflow: hidden;

            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 14px;

            background: #101827;
            border: 1px solid rgba(142, 203, 255, 0.2);

            transition: transform 0.25s ease,
                        border-color 0.25s ease;
        }

        .video-thumbnail:hover {
            transform: translateY(-3px);
            border-color: #8ecbff;
        }

        .video-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            display: flex;
            align-items: center;
            justify-content: center;

            width: 54px;
            height: 54px;
            border-radius: 50%;

            background: rgba(10, 18, 34, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.55);

            color: white;
            font-size: 19px;
            backdrop-filter: blur(8px);
        }

        .video-caption {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;

            color: #b8ddff;
            font-size: 12px;
            letter-spacing: 0.04em;
        }

        .video-caption-detail {
            color: #8ecbff;
            opacity: 0.7;
        }


        /* Remaining SoundCloud players */

        .soundcloud-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .soundcloud-list .soundcloud-player {
            display: block;
            width: 100%;
            border-radius: 12px;
        }


        /* Mobile */

        @media (max-width: 600px) {

            .video-section {
                max-width: 100%;
            }

            .articles-button {
                padding: 11px 18px;
            }

        }

    </style>

</head>
